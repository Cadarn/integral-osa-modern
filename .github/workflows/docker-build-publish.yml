name: Build and Publish OSA Docker Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      push_images:
        description: 'Push images to Docker Hub?'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Publish Multi-Arch OSA Images (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native-arm64
            dockerfile: docker/Dockerfile.native-arm64
            platforms: linux/arm64
            tag_suffix: 11-native-arm64
            runner: ubuntu-latest
          - name: modern-x86
            dockerfile: docker/Dockerfile.modern
            platforms: linux/amd64
            tag_suffix: 11-modern-amd64
            runner: ubuntu-latest
          - name: batch-pipeline
            dockerfile: docker/Dockerfile.batch
            platforms: linux/amd64,linux/arm64
            tag_suffix: 11-batch
            runner: ubuntu-latest



    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Arch Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Target Image Repository
        id: repo-meta
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKER_USER="${DOCKERHUB_USER}"
          if [ -z "$DOCKER_USER" ]; then
            DOCKER_USER="${{ github.repository_owner }}"
          fi
          echo "docker_user=$DOCKER_USER" >> $GITHUB_OUTPUT
          echo "image_name=$DOCKER_USER/osa" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.HAVE_SECRET == 'true'
        env:
          HAVE_SECRET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ steps.repo-meta.outputs.docker_user }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-meta.outputs.image_name }}
          tags: |
            type=raw,value=${{ matrix.tag_suffix }}
            type=raw,value=${{ matrix.tag_suffix }}-${{ github.sha }},enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},suffix=-${{ matrix.tag_suffix }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

